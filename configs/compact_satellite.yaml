run_name: compact-dev-v21
evaluation_protocol: c2w-eval-v2.1
data_version: paired-30d-corrected-v2
random_seeds: [42, 123, 2026]
embargo_hours: 4
spatial_pool: 4
model:
  mode: full
  cnn_width: 8
  embedding_size: 32
  dropout: 0.1
training:
  batch_size: 128
  num_workers: 2
  prefetch_factor: 2
  time_chunk: 12
  learning_rate: 0.001
  weight_decay: 0.0
  max_epochs: 8
  patience: 3
  accumulation_steps: 1
  amp: false
  device: cpu
satellite_statistics:
  maximum_frames: 512
selection:
  metric: daylight_primary_mae
