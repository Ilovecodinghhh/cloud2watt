[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cloud2watt"
version = "0.1.0"
description = "Satellite-cloud-driven photovoltaic power and ramp nowcasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17",
  "pyyaml>=6.0",
  "zarr>=3.1,<4",
]

[project.optional-dependencies]
data = [
  "huggingface-hub>=0.34",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "ocf-blosc2>=0.0.14",
  "pandas>=2.2",
  "pyproj>=3.7",
  "pvlib>=0.11",
]
ml = [
  "torch>=2.4",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cloud2watt"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
